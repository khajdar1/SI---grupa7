name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projekat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            projekat/package-lock.json
            projekat/backend/package-lock.json
            projekat/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests with coverage
        run: npm run test:coverage --workspace backend

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: projekat/backend/coverage/**
          if-no-files-found: warn

