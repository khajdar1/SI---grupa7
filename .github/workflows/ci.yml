name: CI

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality-checks:
    name: Build, typecheck, backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projekat
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: si_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/si_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projekat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          DATABASE_URL="${DATABASE_URL:-mysql://placeholder:placeholder@example.invalid:3306/placeholder}" \
          npm run prisma:generate --workspace backend

      - name: Run database migrations
        run: |
          set -e
          until npx prisma migrate deploy --schema=projekat/backend/prisma/schema.prisma; do
            echo "Waiting for database to become available..."
            sleep 2
          done

      - name: Build (root)
        run: npm run build

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Run backend unit tests with coverage
        run: npm run test:coverage --workspace backend

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: projekat/backend/coverage/**
          if-no-files-found: warn

