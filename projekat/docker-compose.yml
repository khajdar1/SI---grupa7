services:
  mysql:
    image: mysql:8.0
    container_name: si-grupa7-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-service_interventions}
      MYSQL_USER: ${MYSQL_USER:-service_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-service_app}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-service_app_admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-service_admin}
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import/
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    container_name: si-grupa7-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${PUBLIC_HOST:-http://localhost}:3000,http://localhost:3001
      SOCKET_CORS_ORIGIN: ${PUBLIC_HOST:-http://localhost}:3000,http://localhost:3001
      JWT_SECRET: ${JWT_SECRET:-change-me}
      DATABASE_URL: "mysql://${MYSQL_USER:-service_app}:${MYSQL_PASSWORD:-service_app}@mysql:3306/${MYSQL_DATABASE:-service_interventions}"
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-service-system}
      KEYCLOAK_CLIENT_ID:  ${KEYCLOAK_CLIENT_ID:-backend-service}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      RESET_PASSWORD_BASE_URL: ${RESET_PASSWORD_BASE_URL:-http://localhost:3000/reset-password}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      GMAIL_FROM_EMAIL: ${GMAIL_FROM_EMAIL}
      GMAIL_FROM_NAME: ${GMAIL_FROM_NAME:-Sistem za intervencije}
    command: sh -c "npx prisma migrate deploy --schema prisma/schema.prisma && npm run start"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_HOST:-http://localhost}:4000/api/v1
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_HOST:-http://localhost}:4000
    container_name: si-grupa7-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_HOST:-http://localhost}:4000/api/v1
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_HOST:-http://localhost}:4000
    ports:
      - "3000:3000"

volumes:
  mysql_data:
